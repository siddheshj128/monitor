<div class="sidebar">
  <div class="stat-card" *ngFor="let s of stats">
    <div class="stat-top">
      <div>
        <div class="stat-label">{{ s.label }}</div>
        <div class="stat-value" [style.color]="s.color">{{ s.value }}</div>
        <div class="stat-sub" *ngIf="s.sub">{{ s.sub }}</div>
      </div>
      <span class="trend" [attr.data-trend]="s.trend">{{ s.trendValue }}</span>
    </div>
    <apx-chart
      [series]="sparkOptions(s.spark, s.color).series"
      [chart]="sparkOptions(s.spark, s.color).chart"
      [stroke]="sparkOptions(s.spark, s.color).stroke"
      [fill]="sparkOptions(s.spark, s.color).fill"
      [colors]="sparkOptions(s.spark, s.color).colors"
    ></apx-chart>
  </div>
</div>
